<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Market Pulse: a pulse line over a dark tile. The line stays inside the central 80%, so
       phones that crop icons to circles or squircles ("maskable") keep all of it. -->
  <rect width="512" height="512" fill="#0d1117"/>
  <polyline points="96,288 176,288 212,196 256,356 300,148 336,288 416,288"
            fill="none" stroke="#f0883e" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
